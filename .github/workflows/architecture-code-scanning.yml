name: Architecture Code Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  architecture-review:
    name: Analyze example architecture
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ArchSec Reviewer
        run: python -m pip install .

      - name: Generate SARIF report
        run: |
          mkdir -p reports
          archsec-review \
            --input examples/rag-system.yaml \
            --output reports/rag-security-review.sarif \
            --format sarif

      - name: Validate SARIF syntax
        run: |
          python -m json.tool \
            reports/rag-security-review.sarif \
            > /dev/null

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v6
        with:
          name: architecture-security-review-sarif
          path: reports/rag-security-review.sarif
          if-no-files-found: error

      - name: Upload results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/rag-security-review.sarif
          category: archsec-reviewer/example-rag-system