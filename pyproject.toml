[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archsec-reviewer"
version = "0.1.0"
description = "AI-assisted security architecture review for cloud-native, AI, and distributed systems."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    { name = "Khirawdhi Ray" }
]

keywords = [
    "security",
    "security-architecture",
    "threat-modeling",
    "product-security",
    "application-security",
    "cloud-security",
    "ai-security",
    "llm-security",
    "devsecops",
    "architecture-review",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "networkx>=3.2.1,<4",
    "PyYAML>=6.0.3,<7",
]
[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.22",
    "types-networkx>=3.2.1",
    "types-PyYAML>=6.0.12",
]


[project.urls]
Homepage = "https://github.com/khirawdhi/archsec-reviewer"
Repository = "https://github.com/khirawdhi/archsec-reviewer"
Issues = "https://github.com/khirawdhi/archsec-reviewer/issues"

[project.scripts]
archsec-review = "archsec_reviewer.cli:main"

[tool.setuptools.packages.find]
include = ["archsec_reviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
strict = true